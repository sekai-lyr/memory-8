spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/sekai_friend?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}

server.port=${SERVER_PORT:8088}

app.security.jwt-secret=${JWT_SECRET:dev-only-change-this-secret-before-production-please}
app.security.jwt-expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:8088}
app.admin.secret=${ADMIN_SECRET:change-this-admin-secret}

spring.servlet.multipart.max-file-size=80MB
spring.servlet.multipart.max-request-size=90MB

# Session timeout - 2 hours (in case of inactivity)
server.servlet.session.timeout=120m
server.servlet.session.cookie.max-age=7200
# Unique cookie name to avoid conflicts between projects
server.servlet.session.cookie.name=JSESSIONID_M8
